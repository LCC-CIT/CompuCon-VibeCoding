<head>

<title>Over-Stats</title>
<style>
  :root {
    --bg: #0d0d1a; --panel: #141428; --border: rgba(255,255,255,0.06);
    --text: #ccd; --muted: #7a7a90; --orange: #f99e1b; --blue: #00c3ff;
    --tank: #4a90d9; --damage: #e05a3a; --support: #5cb85c;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header {
    text-align: center; padding: 40px 20px 24px;
    background: linear-gradient(180deg, #1a1a30 0%, var(--bg) 100%);
  }
  header h1 { font-size: 2.4rem; letter-spacing: 0.06em; color: #fff; }
  header p  { color: var(--muted); margin-top: 6px; }
  .filters {
    display: flex; justify-content: center; gap: 10px; padding: 0 20px 30px;
    flex-wrap: wrap;
  }
  .filters button {
    padding: 8px 22px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.12);
    background: var(--panel); color: var(--text); font-size: 0.85rem;
    font-weight: 600; cursor: pointer; letter-spacing: 0.05em;
    transition: all 0.15s;
  }
  .filters button:hover { border-color: rgba(255,255,255,0.3); }
  .filters button.active { background: var(--orange); color: #000; border-color: var(--orange); }
  .filters button.tank.active { background: var(--tank); border-color: var(--tank); }
  .filters button.damage.active { background: var(--damage); border-color: var(--damage); }
  .filters button.support.active { background: var(--support); border-color: var(--support); }

  .grid {
    max-width: 1300px; margin: 0 auto; padding: 0 20px 40px;
    columns: 3; column-gap: 20px;
  }
  @media (max-width: 1100px) { .grid { columns: 2; } }
  @media (max-width:  700px) { .grid { columns: 1; } }

  .card {
    break-inside: avoid; margin-bottom: 16px;
    background: var(--panel); border-radius: 8px; border: 1px solid var(--border);
    overflow: hidden; transition: border-color 0.2s;
  }
  .card:hover { border-color: rgba(255,255,255,0.18); }
  .card-head {
    padding: 14px 16px; display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid var(--border);
  }
  .card-icon {
    width: 40px; height: 40px; border-radius: 6px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem; font-weight: 900; color: #fff;
    overflow: hidden;
  }
  .tank-icon    { background: var(--tank); }
  .damage-icon  { background: var(--damage); }
  .support-icon { background: var(--support); }

  .card-name   { font-weight: 700; font-size: 0.95rem; letter-spacing: 0.02em; }
  .card-real   { font-size: 0.75rem; color: var(--muted); }
  .card-role   { font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; }
  .card-body   { padding: 12px 16px; }
  .card-story  { font-size: 0.82rem; line-height: 1.6; color: #b0b0c8; margin-bottom: 10px; }
  .card-abilities { font-size: 0.76rem; color: var(--muted); line-height: 1.6; }
  .card-abilities strong { color: var(--orange); }
  .hidden { display: none; }

  footer {
    text-align: center; padding: 20px; color: var(--muted); font-size: 0.72rem;
    letter-spacing: 0.06em; border-top: 1px solid var(--border);
  }
</style>
</head>

// ── Fetch portraits & Render ─────────────────────
const grid = document.getElementById('grid');
let portraits = {};

function slug(name) {
  return name.toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[.:]/g, '')
    .replace(/\s+/g, '-');
}

(async function loadPortraits() {
  try {
    const res = await fetch('https://overfast-api.tekrop.fr/heroes');
    const data = await res.json();
    data.forEach(h => { portraits[h.key] = h.portrait; });
  } catch(e) { /* use letter fallback */ }
  render('all');
})();

function render(filterRole) {
  grid.innerHTML = '';
  heroes.forEach(h => {
    if (filterRole !== 'all' && h.role !== filterRole) return;
    const cls = h.role + '-icon';
    const imgSrc = portraits[slug(h.name)] || '';
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-head">
        <div class="card-icon ${cls}">${imgSrc ? `<img src="${imgSrc}" alt="${h.name}" onerror="this.style.display='none'" style="width:100%;height:100%;object-fit:cover">` : h.name[0]}</div>
        <div style="flex:1;min-width:0">
          <div class="card-name">${h.name}</div>
          <div class="card-real">${h.real}</div>
        </div>
        <span style="font-size:0.78rem;font-weight:700;color:#fff;background:rgba(255,255,255,0.08);padding:3px 10px;border-radius:4px;white-space:nowrap;margin-right:6px">${h.hp}</span>
        <div class="card-role" style="color:var(--${h.role})">${h.role}</div>
      </div>
      <div class="card-body">
        <div class="card-story">${h.story}</div>
        <div class="card-abilities">${h.ab}</div>
      </div>`;
    grid.appendChild(card);
  });
}

function filter(role) {
  document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector(`.filters button.${role}`) || document.querySelector('.filters button:first-child');
  btn.classList.add('active');
  render(role);
}
</script>
