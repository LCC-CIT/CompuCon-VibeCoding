<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Recommender</title>
<style>
  :root {
    --bg: #f5efe4;
    --panel: #fffdf8;
    --card: #fbf7ee;
    --ink: #2b2620;
    --muted: #8a7f6d;
    --accent: #b3541e;
    --accent-soft: #f3e2d4;
    --line: #e7ddcb;
    --good: #3f7d4e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .app {
    width: 100%;
    max-width: 560px;
    background: var(--panel);
    border-radius: 20px;
    padding: 36px;
    box-shadow: 0 20px 60px rgba(80, 60, 30, .15);
    border: 1px solid var(--line);
  }

  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.9rem;
    letter-spacing: .3px;
    margin-bottom: 4px;
  }

  .subtitle {
    color: var(--muted);
    font-size: .95rem;
    margin-bottom: 26px;
  }

  /* Progress */
  .progress {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 26px;
  }
  .progress .step {
    font-size: .72rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    white-space: nowrap;
  }
  .progress .bar {
    flex: 1;
    height: 6px;
    background: var(--line);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress .bar .fill {
    height: 100%;
    background: var(--accent);
    border-radius: 99px;
    transition: width .25s ease;
  }

  .question {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.35rem;
    margin-bottom: 22px;
    line-height: 1.35;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
    width: 100%;
    text-align: left;
    padding: 14px 16px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    cursor: pointer;
    font-size: 1rem;
    font-weight: 500;
    color: var(--ink);
    transition: all .12s ease;
    font-family: inherit;
  }
  .option:hover {
    border-color: var(--accent);
    background: var(--accent-soft);
    transform: translateY(-1px);
  }
  .option:active { transform: translateY(0) scale(.99); }

  .option .desc {
    display: block;
    font-size: .8rem;
    color: var(--muted);
    font-weight: 400;
    margin-top: 2px;
  }

  .nav {
    display: flex;
    justify-content: space-between;
    margin-top: 24px;
  }
  .nav button {
    background: none;
    border: 1px solid var(--line);
    color: var(--muted);
    border-radius: 8px;
    padding: 9px 18px;
    cursor: pointer;
    font-size: .88rem;
    font-family: inherit;
    transition: all .12s ease;
  }
  .nav button:hover { color: var(--ink); border-color: var(--ink); }
  .nav button:disabled { opacity: .4; cursor: default; }

  .text-input {
    width: 100%;
    padding: 13px 14px;
    font-size: 1rem;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--card);
    color: var(--ink);
    font-family: inherit;
    outline: none;
    margin-bottom: 12px;
  }
  .text-input:focus { border-color: var(--accent); background: #fff; }
  .text-actions { display: flex; gap: 10px; }
  .text-actions .submit-btn {
    flex: 1;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 13px;
    border-radius: 12px;
    cursor: pointer;
    font-size: .95rem;
    font-weight: 600;
    font-family: inherit;
  }
  .text-actions .submit-btn:hover { filter: brightness(1.08); }
  .text-actions .skip-btn {
    background: none;
    border: 1px solid var(--line);
    color: var(--muted);
    border-radius: 12px;
    padding: 13px 18px;
    cursor: pointer;
    font-size: .95rem;
    font-family: inherit;
  }
  .text-actions .skip-btn:hover { color: var(--ink); border-color: var(--ink); }

  /* Results */
  .results { display: none; }
  .results.show { display: block; animation: fade .3s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .hero {
    background: var(--accent-soft);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 28px;
    text-align: center;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }
  .hero .tag {
    display: inline-block;
    font-size: .68rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 8px;
  }
  .hero h2 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.7rem;
    margin-bottom: 2px;
  }
  .hero .author {
    color: var(--muted);
    font-style: italic;
    margin-bottom: 12px;
  }
  .hero .blurb {
    font-size: .95rem;
    line-height: 1.5;
    color: #5b5243;
  }
  .matches {
    margin-top: 16px;
    font-size: .82rem;
    color: var(--muted);
  }
  .matches b { color: var(--good); }
  .hero-inner { position: relative; z-index: 1; }
  .hero-watermark {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 230px; height: 230px;
    color: var(--accent);
    opacity: .07;
    pointer-events: none;
  }
  .hero-watermark svg { width: 100%; height: 100%; }
  .motif { display: flex; justify-content: center; margin-bottom: 12px; }
  .motif svg { width: 64px; height: 64px; }
  .cover {
    width: 96px; height: 144px;
    object-fit: cover;
    border-radius: 8px;
    box-shadow: 0 10px 26px rgba(0,0,0,.28);
    border: 1px solid rgba(0,0,0,.08);
    background: #fff;
  }
  .runner-motif { display: flex; align-items: center; }
  .runner-motif svg { width: 30px; height: 30px; flex: none; }

  .runners {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .runner {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--card);
  }
  .runner .meta { flex: 1; }
  .runner .title { font-weight: 600; }
  .runner .author { color: var(--muted); font-size: .85rem; font-style: italic; }
  .runner .also { font-size: .7rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }

  .read-btn {
    background: none;
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
    font-size: .85rem;
    font-family: inherit;
    transition: all .12s ease;
  }
  .read-btn:hover { background: var(--accent); color: #fff; }
  .hero .read-btn { margin-top: 16px; }
  .runner-read { padding: 4px 10px; font-size: .72rem; }

  .restart {
    margin-top: 20px;
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 13px;
    cursor: pointer;
    font-size: .95rem;
    font-weight: 600;
    font-family: inherit;
    transition: filter .12s ease;
  }
  .restart:hover { filter: brightness(1.08); }

  .more {
    margin-top: 20px;
    text-align: left;
  }
  .more h3 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.1rem;
    margin-bottom: 2px;
  }
  .more .more-note {
    font-size: .78rem;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .more-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .more-item {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--card);
    font-size: .9rem;
  }
  .more-item .t { flex: 1; font-weight: 600; }
  .more-item a { color: inherit; text-decoration: none; }
  .more-item a:hover { text-decoration: underline; color: var(--accent); }
  .more-item .meta {
    color: var(--muted);
    font-size: .78rem;
    white-space: nowrap;
    text-align: right;
  }
  .more-status { color: var(--muted); font-size: .88rem; }

  /* Smooth color shifts when the theme changes */
  body, .app, .option, .runner, .more-item, .text-input, .hero,
  h1, .subtitle, .question, .nav button, .skip-btn, .read-btn {
    transition: background-color .4s ease, color .4s ease, border-color .4s ease, transform .15s ease, filter .15s ease;
  }
</style>
</head>
<body>
  <div class="app">
    <h1>Book Match</h1>
    <p class="subtitle">Answer a few quick questions and we'll find your next read.</p>

    <!-- Quiz -->
    <div id="quiz">
      <div class="progress">
        <span class="step" id="step-label">Question 1 of 7</span>
        <div class="bar"><div class="fill" id="bar-fill" style="width: 0%"></div></div>
      </div>
      <div class="question" id="question"></div>
      <div class="options" id="options"></div>
      <div class="nav">
        <button id="back" disabled>← Back</button>
      </div>
    </div>

    <!-- Results -->
    <div class="results" id="results"></div>
  </div>

<script>

  const answers = {};
  const readTitles = new Set();
  let current = 0;

  const quizEl = document.getElementById('quiz');
  const resultsEl = document.getElementById('results');
  const questionEl = document.getElementById('question');
  const optionsEl = document.getElementById('options');
  const stepLabel = document.getElementById('step-label');
  const barFill = document.getElementById('bar-fill');
  const backBtn = document.getElementById('back');

  function renderQuestion() {
    const q = QUESTIONS[current];
    questionEl.textContent = q.question;
    stepLabel.textContent = `Question ${current + 1} of ${QUESTIONS.length}`;
    barFill.style.width = (current / QUESTIONS.length * 100) + '%';
    backBtn.disabled = current === 0;

    optionsEl.innerHTML = '';

    if (q.type === 'text') {
      optionsEl.innerHTML = `
        <input id="fav-input" class="text-input" type="text" placeholder="${q.placeholder}" autocomplete="off">
        <div class="text-actions">
          <button class="submit-btn" id="fav-submit">Find recommendations</button>
          <button class="skip-btn" id="fav-skip">Skip</button>
        </div>`;
      const input = document.getElementById('fav-input');
      const submit = () => submitFavorite(input.value);
      input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
      document.getElementById('fav-submit').addEventListener('click', submit);
      document.getElementById('fav-skip').addEventListener('click', () => submitFavorite(''));
      input.focus();
      return;
    }

    q.options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option';
      btn.innerHTML = `<span>${opt.label}</span>${opt.desc ? `<span class="desc">${opt.desc}</span>` : ''}`;
      btn.addEventListener('click', () => choose(q.key, opt.value));
      optionsEl.appendChild(btn);
    });
  }

  function advance() {
    if (current < QUESTIONS.length - 1) { current++; renderQuestion(); }
    else showResults();
  }

  function choose(key, value) {
    answers[key] = value;
    applyTheme();
    advance();
  }

  function submitFavorite(value) {
    const v = value.trim();
    if (v) answers.favorite = v;
    advance();
  }

  backBtn.addEventListener('click', () => {
    if (current > 0) { current--; renderQuestion(); }
  });

  function applyTheme() {
    const theme = (answers.genre && THEMES[answers.genre]) ||
                  (answers.mood && THEMES[answers.mood]) ||
                  THEMES.default;
    const root = document.documentElement;
    root.style.setProperty('--bg', theme.bg);
    root.style.setProperty('--panel', theme.panel);
    root.style.setProperty('--card', theme.card);
    root.style.setProperty('--ink', theme.ink);
    root.style.setProperty('--muted', theme.muted);
    root.style.setProperty('--accent', theme.accent);
    root.style.setProperty('--accent-soft', theme.accentSoft);
    root.style.setProperty('--line', theme.line);
  }

    eye: '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>',
    clock: '<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/>',
    moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>',
    star: '<polygon points="12 2 15 9 22 9 16.5 14 18.5 21 12 17 5.5 21 7.5 14 2 9 9 9 12 2"/>',
    compass: '<circle cx="12" cy="12" r="9"/><polygon points="16 8 13.5 13.5 8 16 10.5 10.5 16 8"/>',
    crown: '<path d="M3 17h18v3H3z"/><path d="M4 8l3.5 3L12 6l4.5 5L20 8v6H4z"/>',
    sword: '<path d="M12 3v11"/><path d="M8 9h8"/><path d="M12 14l-3 7h6z"/>',
    flame: '<path d="M12 3c2.5 4 4 6.5 4 9a4 4 0 0 1-8 0c0-2.5 1.5-5 4-9z"/><path d="M12 20a1.8 1.8 0 0 1 0-3.6 1.8 1.8 0 0 1 0 3.6z"/>',
    rocket: '<path d="M12 3c2.7 2.7 3.8 6.4 3.8 10L12 20l-3.8-7C8.2 9.4 9.3 5.7 12 3z"/><circle cx="12" cy="10" r="1.5"/>',
    planet: '<circle cx="12" cy="12" r="4.2"/><ellipse cx="12" cy="12" rx="10" ry="3.6" transform="rotate(-18 12 12)"/>',
    ring: '<circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="3.5"/>',
    broom: '<path d="M12 22v-8"/><path d="M12 14c-2-1.2-3-2.8-3-4.8 0-.4.4-.7.7-.7h4.6c.3 0 .7.3.7.7 0 2-1 3.6-3 4.8z"/>',
    castle: '<path d="M3 21v-5h2v5M8 21v-5h2v5M13 21v-5h2v5M18 21v-5h2v5"/><path d="M2 16h20v-4H2z"/>'
  };

  const GENRE_MOTIFS = {
    highfantasy: 'castle',
    lowfantasy: 'star',
    scifi: 'planet',
    mystery: 'search',
    thriller: 'eye',
    romance: 'heart',
    dystopia: 'flame',
    historical: 'book',
    nonfiction: 'book'
  };

  const BOOK_MOTIFS = {
    "Harry Potter and the Sorcerer's Stone": 'broom',
    "The Hobbit": 'ring',
    "The Martian": 'rocket',
    "The Hitchhiker's Guide to the Galaxy": 'rocket',
    "Ready Player One": 'rocket',
    "Foundation": 'planet',
    "A Game of Thrones": 'sword',
    "The Way of Kings": 'sword',
    "Mistborn": 'flame',
    "The Name of the Wind": 'zap',
    "1984": 'eye',
    "The Hunger Games": 'flame',
    "Fahrenheit 451": 'flame',
    "Percy Jackson: The Lightning Thief": 'zap',
    "A Wrinkle in Time": 'planet',
    "The Giver": 'eye',
    "The Time Traveler's Wife": 'clock',
    "The Girl on the Train": 'eye',
    "Gone Girl": 'eye',
    "The Da Vinci Code": 'search',
    "The Selection": 'crown',
    "Red, White & Royal Blue": 'crown',
    "Good Omens": 'star',
    "American Gods": 'moon',
    "Piranesi": 'compass',
    "Circe": 'zap',
    "Redwall": 'sword',
    "The Lion, the Witch and the Wardrobe": 'star',
    "City of Ember": 'flame',
    "Scythe": 'moon'
  };

  function svg(name) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + (SVG_MOTIFS[name] || SVG_MOTIFS.book) + '</svg>';
  }

  function getMotif(book) {
    return BOOK_MOTIFS[book.title] || GENRE_MOTIFS[book.genre] || 'book';
  }

  const GENRE_COLORS = {
    highfantasy: '#2f6b3a',
    lowfantasy: '#6d4a9e',
    scifi: '#1b6f8f',
    mystery: '#35477d',
    thriller: '#8f1f1f',
    romance: '#b8446e',
    dystopia: '#4a5259',
    historical: '#8a5a2b',
    nonfiction: '#2f5d86'
  };

  const BOOK_COLORS = {
    "Harry Potter and the Sorcerer's Stone": '#7a1f1f',
    "The Hobbit": '#3f7a2a',
    "The Martian": '#c1440e',
    "The Hitchhiker's Guide to the Galaxy": '#2f8a6a',
    "Ready Player One": '#a0551f',
    "Foundation": '#4a6b8a',
    "Dune": '#a07a2f',
    "A Game of Thrones": '#5a2020',
    "The Way of Kings": '#1f6b6b',
    "Mistborn": '#5a6a7a',
    "The Name of the Wind": '#b07a1f',
    "1984": '#33383f',
    "The Hunger Games": '#b3541e',
    "Fahrenheit 451": '#d4461f',
    "Percy Jackson: The Lightning Thief": '#1d4e89',
    "A Wrinkle in Time": '#3a6b8a',
    "The Giver": '#8a8f96',
    "The Time Traveler's Wife": '#5a6b8a',
    "The Girl on the Train": '#3a3a4a',
    "Gone Girl": '#4a2a2a',
    "The Da Vinci Code": '#7a5c1f',
    "The Selection": '#9a5c8f',
    "Red, White & Royal Blue": '#34558b',
    "Good Omens": '#6b1f1f',
    "American Gods": '#4a3f5a',
    "Piranesi": '#6b8a7a',
    "Circe": '#b08a1f',
    "Redwall": '#7a4a1f',
    "The Lion, the Witch and the Wardrobe": '#3a6b7a',
    "City of Ember": '#b3541e',
    "Scythe": '#3f4a5a',
    "Twilight": '#6b1f2a'
  };

  function getColor(book) {
    return BOOK_COLORS[book.title] || GENRE_COLORS[book.genre] || '#b3541e';
  }

  function crest(name, color) {
    const inner = SVG_MOTIFS[name] || SVG_MOTIFS.book;
    return '<svg viewBox="0 0 24 24" fill="none">' +
      '<path d="M12 1.5 L21 5 V11 C21 16.5 16.5 20.5 12 23 C7.5 20.5 3 16.5 3 11 V5 Z" fill="' + color + '"/>' +
      '<path d="M12 3.3 L19.2 6 V11 C19.2 15.7 15 19.3 12 21.6 C9 19.3 4.8 15.7 4.8 11 V6 Z" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="0.9"/>' +
      '<svg x="6" y="6" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' + inner + '</svg>' +
      '</svg>';
  }

  async function fetchCover(title, author) {
    try {
      const url = 'https://openlibrary.org/search.json?q=' + encodeURIComponent(title + ' ' + author) +
        '&fields=cover_i&limit=1';
      const data = await fetch(url).then(r => r.json());
      const doc = data.docs && data.docs[0];
      if (doc && doc.cover_i) return 'https://covers.openlibrary.org/b/id/' + doc.cover_i + '-L.jpg';
    } catch (e) {}
    return null;
  }

  const AGE_ALLOWED = {
    kids: ['kids'],
    teen: ['kids', 'teen'],
    adult: ['teen', 'adult']
  };

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  }

  function scoreBooks() {
    const allowed = AGE_ALLOWED[answers.age] || ['kids', 'teen', 'adult'];
    let pool = BOOKS.filter(b => allowed.includes(b.age) && !readTitles.has(b.title));

    // Genre-first: if any age-appropriate book matches the genre, stick to those.
    const genreMatch = pool.filter(b => b.genre === answers.genre);
    if (genreMatch.length) pool = genreMatch;

    const scored = pool.map(book => {
      let s = 0;
      for (const [key, val] of Object.entries(answers)) {
        if (key === 'age' || key === 'genre' || key === 'favorite') continue;
        if (key === 'series' && val === 'either') continue;
        if (book[key] === val) s += 2;
      }
      return { book, score: s };
    });

    // Shuffle then stable-sort so ties break randomly → different books each run.
    shuffle(scored);
    return scored.sort((a, b) => b.score - a.score);
  }

  function matchedLabels(book) {
    const labels = { age: 'age', mood: 'mood', genre: 'genre', length: 'length', pace: 'pace', series: 'series' };
    return Object.entries(answers)
      .filter(([k, v]) => book[k] === v)
      .map(([k]) => labels[k]);
  }

  const SUBJECT_MAP = {
    scifi: 'science fiction',
    highfantasy: 'fantasy',
    lowfantasy: 'fantasy',
    mystery: 'mystery',
    thriller: 'thriller',
    romance: 'romance',
    dystopia: 'dystopias',
    historical: 'historical fiction',
    nonfiction: 'nonfiction'
  };

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function isEnglish(doc) {
    const langs = doc.language || [];
    if (langs.length && !langs.includes('eng')) return false;
    const t = doc.title || '';
    return !/[^\x20-\x7E]/.test(t); // drop titles with accents/non-Latin scripts
  }

  function hasSubject(doc, re) {
    return Array.isArray(doc.subject) && doc.subject.some(s => re.test(s));
  }

  function filterByAge(docs, age) {
    if (age === 'kids') return docs.filter(d => hasSubject(d, /juvenile|children/i));
    if (age === 'teen') return docs.filter(d => hasSubject(d, /young adult|juvenile|teen/i));
    if (age === 'adult') return docs.filter(d => !hasSubject(d, /juvenile|young adult/i));
    return docs;
  }

  function moreItemHtml(b) {
    const author = (b.author_name && b.author_name[0]) || 'Unknown author';
    const year = b.first_publish_year ? ` · ${b.first_publish_year}` : '';
    const pages = b.number_of_pages_median ? ` · ~${b.number_of_pages_median} pages` : '';
    const link = b.key ? `https://openlibrary.org${b.key}` : '#';
    return `<div class="more-item">
      <span class="t"><a href="${link}" target="_blank" rel="noopener">${escapeHtml(b.title)}</a></span>
      <span class="meta">${escapeHtml(author)}${year}${pages}</span>
    </div>`;
  }

  async function fetchMore(genre, age) {
    const subject = SUBJECT_MAP[genre] || genre;
    const q = subject.includes(' ') ? `subject:"${subject}"` : `subject:${subject}`;
    const url = 'https://openlibrary.org/search.json?q=' + encodeURIComponent(q) +
      '&lang=eng&limit=50&fields=title,author_name,first_publish_year,number_of_pages_median,subject,key,language';
    const data = await fetch(url).then(r => r.json());
    const docs = (data.docs || []).filter(isEnglish);
    let list = filterByAge(docs, age);
    if (list.length < 3 && age !== 'kids') list = docs;
    return list.slice(0, 10);
  }

  async function loadMore(genre, age) {
    const list = document.getElementById('more-list');
    try {
      const books = await fetchMore(genre, age);
      if (!books.length) {
        list.innerHTML = '<span class="more-status">No extra results found for this genre.</span>';
        return;
      }
      list.innerHTML = books.map(moreItemHtml).join('');
    } catch (err) {
      list.innerHTML = '<span class="more-status">Couldn\'t reach Open Library. Check your connection and try again.</span>';
    }
  }

  async function loadBecauseLiked(query) {
    const box = document.getElementById('liked-list');
    try {
      const resolveUrl = 'https://openlibrary.org/search.json?q=' + encodeURIComponent(query) +
        '&limit=1&fields=key,title,author_name,subject';
      const rd = await fetch(resolveUrl).then(r => r.json());
      const top = (rd.docs && rd.docs[0]) || null;
      if (!top) {
        box.innerHTML = '<span class="more-status">Couldn\'t find that author or book.</span>';
        return;
      }

      const author = top.author_name && top.author_name[0];
      const subject = (top.subject || []).find(s => !/fiction$/i.test(s) && !/juvenile|children/i.test(s));

      const terms = [];
      if (author) terms.push('author:"' + author + '"');
      if (subject) terms.push('subject:"' + subject + '"');
      if (!terms.length) {
        box.innerHTML = '<span class="more-status">No similar books found.</span>';
        return;
      }

      const url = 'https://openlibrary.org/search.json?q=' + encodeURIComponent(terms.join(' OR ')) +
        '&lang=eng&limit=20&fields=title,author_name,first_publish_year,number_of_pages_median,key,language';
      const data = await fetch(url).then(r => r.json());
      const docs = (data.docs || [])
        .filter(isEnglish)
        .filter(d => d.title !== top.title)
        .slice(0, 8);

      if (!docs.length) {
        box.innerHTML = '<span class="more-status">No similar books found.</span>';
        return;
      }
      box.innerHTML = docs.map(moreItemHtml).join('');
    } catch (err) {
      box.innerHTML = '<span class="more-status">Couldn\'t reach Open Library. Check your connection and try again.</span>';
    }
  }

  function renderPicks() {
    const top = scoreBooks();
    const picksEl = document.getElementById('picks');

    if (!top.length) {
      picksEl.innerHTML = `<div class="hero">
        <span class="tag">All caught up</span>
        <p class="blurb">You've marked everything in this match as read. Try different answers or start over.</p>
      </div>`;
      return;
    }

    const best = top[0];
    const runners = top.slice(1, 3);
    const matched = matchedLabels(best.book);
    const bookColor = getColor(best.book);
    const crestSvg = crest(getMotif(best.book), bookColor);

    picksEl.innerHTML = `
      <div class="hero">
        <div class="hero-watermark">${crestSvg}</div>
        <div class="hero-inner">
          <div class="motif" id="hero-visual">${crestSvg}</div>
          <span class="tag" style="color:${bookColor}">Your next read</span>
          <h2>${best.book.title}</h2>
          <div class="author">by ${best.book.author}</div>
          <p class="blurb">${best.book.blurb}</p>
          <p class="matches">Matched your <b>${matched.join(', ')}</b></p>
          <button class="read-btn" data-title="${escapeHtml(best.book.title)}">Already read this — suggest another</button>
        </div>
      </div>
      ${runners.length ? `<div class="runners">
        ${runners.map(r => `
          <div class="runner">
            <span class="runner-motif">${crest(getMotif(r.book), getColor(r.book))}</span>
            <span class="meta">
              <span class="title">${r.book.title}</span>
              <span class="author">by ${r.book.author}</span>
            </span>
            <button class="read-btn runner-read" data-title="${escapeHtml(r.book.title)}">already read</button>
          </div>`).join('')}
      </div>` : ''}
    `;

    picksEl.querySelectorAll('.read-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        readTitles.add(btn.dataset.title);
        renderPicks();
      });
    });

    const visual = picksEl.querySelector('#hero-visual');
    fetchCover(best.book.title, best.book.author).then(url => {
      if (!url || !visual) return;
      const img = document.createElement('img');
      img.className = 'cover';
      img.alt = best.book.title + ' cover';
      img.onload = () => { visual.innerHTML = ''; visual.appendChild(img); };
      img.onerror = () => {};
      img.src = url;
    });
  }

  function showResults() {
    quizEl.style.display = 'none';
    resultsEl.classList.add('show');
    resultsEl.innerHTML = `
      <div id="picks"></div>
      ${answers.favorite ? `
      <div class="more">
        <h3>Because you liked ${escapeHtml(answers.favorite)}</h3>
        <p class="more-note">More like it, from Open Library</p>
        <div class="more-list" id="liked-list"><span class="more-status">Searching Open Library…</span></div>
      </div>` : ''}
      <div class="more">
        <h3>More in this genre</h3>
        <p class="more-note">Live results from Open Library</p>
        <div class="more-list" id="more-list"><span class="more-status">Searching Open Library…</span></div>
      </div>
      <button class="restart" id="restart">Start over</button>
    `;

    renderPicks();
    document.getElementById('restart').addEventListener('click', restart);
    loadMore(answers.genre, answers.age);
    if (answers.favorite) loadBecauseLiked(answers.favorite);
  }

  function restart() {
    for (const k in answers) delete answers[k];
    readTitles.clear();
    current = 0;
    applyTheme();
    resultsEl.classList.remove('show');
    resultsEl.innerHTML = '';
    quizEl.style.display = '';
    renderQuestion();
  }

  renderQuestion();
</script>
