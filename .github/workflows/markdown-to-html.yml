name: Convert changed curriculum markdown to docs HTML

on:
  push:
    paths:
      - 'curriculum/**/*.md'
      - '.github/workflows/markdown-to-html.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get changed markdown files
        id: changed
        uses: tj-actions/changed-files@v47
        with:
          files: |
            curriculum/**/*.md

      - name: Install pandoc
        if: steps.changed.outputs.any_changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Convert only changed markdown files to docs
        if: steps.changed.outputs.any_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs

          # changed-files output is newline-separated
          while IFS= read -r md; do
            [ -z "$md" ] && continue
            [ ! -f "$md" ] && continue  # skip deleted/renamed-away files

            rel="${md#curriculum/}"          # unit1/lesson.md
            out="docs/${rel%.md}.html"       # docs/unit1/lesson.html
            mkdir -p "$(dirname "$out")"

            echo "Converting $md -> $out"
            pandoc "$md" -f markdown -t html5 -s -o "$out"
          done <<< "${{ steps.changed.outputs.all_changed_files }}"

      - name: Commit docs updates
        if: steps.changed.outputs.any_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add docs

          if git diff --cached --quiet; then
            echo "No docs changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto-generate docs HTML from changed curriculum markdown"
          git push

      - name: No markdown changes
        if: steps.changed.outputs.any_changed != 'true'
        run: echo "No curriculum markdown changes detected."