name: Convert Markdown to HTML

on:
  push:
    branches:
      - main
    paths:
      - 'curriculum/**/*.md'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed markdown files
        id: changed-md
        uses: tj-actions/changed-files@v45
        with:
          files: |
            curriculum/**/*.md

      - name: Install pandoc
        if: steps.changed-md.outputs.any_changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Convert changed markdown files to HTML
        if: steps.changed-md.outputs.any_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          for md in ${{ steps.changed-md.outputs.all_changed_files }}; do
            if [ -f "$md" ]; then
              html="${md%.md}.html"
              echo "Converting $md -> $html"
              pandoc "$md" -f markdown -t html5 -s -o "$html"
            fi
          done

      - name: Commit and push changes
        if: steps.changed-md.outputs.any_changed == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add curriculum/
          if ! git diff --staged --quiet; then
            git commit -m "Auto-convert updated markdown files to HTML"
            git push
          else
            echo "No HTML changes to commit."
          fi
