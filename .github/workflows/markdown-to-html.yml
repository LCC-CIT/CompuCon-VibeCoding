name: Convert changed curriculum markdown to docs HTML

on:
  push:
    branches:
      - main
    paths:
      - 'curriculum/**/*.md'
      - '.github/workflows/markdown-to-html.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed markdown files
        id: changed
        uses: tj-actions/changed-files@v45
        with:
          files: |
            curriculum/**/*.md

      - name: Install pandoc
        if: steps.changed.outputs.any_changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Convert only changed markdown files to docs
        if: steps.changed.outputs.any_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          touch docs/.nojekyll

          for md in ${{ steps.changed.outputs.all_changed_files }}; do
            if [ -f "$md" ]; then
              rel="${md#curriculum/}"          # session-1/lesson-plan.md
              out="docs/${rel%.md}.html"       # docs/session-1/lesson-plan.html
              mkdir -p "$(dirname "$out")"

              echo "Converting $md -> $out"
              pandoc "$md" -f markdown -t html5 -s -o "$out"
            fi
          done

      - name: Commit docs updates
        if: steps.changed.outputs.any_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add docs/

          if git diff --cached --quiet; then
            echo "No docs changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto-generate docs HTML from changed curriculum markdown"
          git push

      - name: No markdown changes
        if: steps.changed.outputs.any_changed != 'true'
        run: echo "No curriculum markdown changes detected."