name: Convert curriculum markdown to docs HTML (Full Sync & Cleanup)

on:
  push:
    branches:
      - main
    paths:
      - 'curriculum/**/*.md'
      - '.github/workflows/cleanup-deleted-markdown-html.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Convert all curriculum markdown into docs and clean up stale HTML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          touch docs/.nojekyll

          # Step 1: Convert all existing .md files in curriculum/ to docs/
          count=0
          while IFS= read -r -d '' md; do
            rel="${md#curriculum/}"
            out="docs/${rel%.md}.html"
            mkdir -p "$(dirname "$out")"
            echo "Converting $md -> $out"
            pandoc "$md" -f markdown -t html5 -s -o "$out"
            count=$((count+1))
          done < <(find curriculum -type f -name '*.md' -print0)

          echo "Converted $count files."

          # Hand-authored pages. These have no markdown source in curriculum/ and must
          # NOT be treated as stale. Add any new hand-written page here, or the cleanup
          # step below will delete it on the next run.
          HANDWRITTEN=(
            "docs/index.html"
            "docs/middle-school.html"
            "docs/high-school.html"
            "docs/faq.html"
          )

          is_handwritten() {
            local candidate="$1"
            for keep in "${HANDWRITTEN[@]}"; do
              [ "$candidate" = "$keep" ] && return 0
            done
            return 1
          }

          # Step 2: Delete any .html in docs/ whose corresponding .md no longer exists in
          # curriculum/ — except the hand-authored pages listed above.
          while IFS= read -r -d '' html; do
            if is_handwritten "$html"; then
              echo "Keeping hand-authored page: $html"
              continue
            fi
            rel="${html#docs/}"
            source_md="curriculum/${rel%.html}.md"
            if [ ! -f "$source_md" ]; then
              echo "Removing stale HTML file: $html"
              rm -f "$html"
            fi
          done < <(find docs -type f -name '*.html' -print0)

      - name: Commit docs updates
        shell: bash
        run: |
          set -euo pipefail
          git add docs/

          if git diff --cached --quiet; then
            echo "No docs changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto-generate docs HTML from curriculum markdown and cleanup stale files"
          git push