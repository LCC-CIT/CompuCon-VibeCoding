name: Remove docs HTML for deleted curriculum markdown

on:
  push:
    paths:
      - 'curriculum/**/*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get deleted markdown files
        id: changed
        uses: tj-actions/changed-files@v47
        with:
          files: |
            curriculum/**/*.md
          files_ignore: |
            **/*.html
          separator: "\n"

      - name: Remove matching docs html for deleted markdown
        if: steps.changed.outputs.deleted_files != ''
        shell: bash
        run: |
          set -euo pipefail

          deleted="${{ steps.changed.outputs.deleted_files }}"
          if [ -z "$deleted" ]; then
            echo "No deleted markdown files."
            exit 0
          fi

          removed_any=0
          while IFS= read -r md; do
            [ -z "$md" ] && continue

            rel="${md#curriculum/}"        # e.g. unit1/lesson.md
            html="docs/${rel%.md}.html"    # e.g. docs/unit1/lesson.html

            if [ -f "$html" ]; then
              echo "Removing stale file: $html"
              rm -f "$html"
              removed_any=1
            else
              echo "Already absent: $html"
            fi
          done <<< "$deleted"

          if [ "$removed_any" -eq 0 ]; then
            echo "Nothing removed."
          fi

      - name: Commit removals
        if: steps.changed.outputs.deleted_files != ''
        shell: bash
        run: |
          set -euo pipefail
          git add -A docs

          if git diff --cached --quiet; then
            echo "No cleanup changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove stale docs HTML for deleted curriculum markdown"
          git push