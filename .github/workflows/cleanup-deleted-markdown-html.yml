name: Convert curriculum markdown to docs HTML

on:
  push:
    paths:
      - 'curriculum/**/*.md'
      - '.github/workflows/markdown-to-html.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Convert all curriculum markdown into docs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs

          count=0
          while IFS= read -r -d '' md; do
            rel="${md#curriculum/}"
            out="docs/${rel%.md}.html"
            mkdir -p "$(dirname "$out")"
            echo "Converting $md -> $out"
            pandoc "$md" -f markdown -t html5 -s -o "$out"
            count=$((count+1))
          done < <(find curriculum -type f -name '*.md' -print0)

          echo "Converted files: $count"
          find docs -type f -name '*.html' -print || true

      - name: Commit docs updates
        shell: bash
        run: |
          set -euo pipefail
          git add docs
          git status --short

          if git diff --cached --quiet; then
            echo "No docs changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto-generate docs HTML from curriculum markdown"
          git push